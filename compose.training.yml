services:
  dvwa:
    build: .
    image: dvwa:unauthenticated-training
    environment:
      DB_SERVER: db
      DVWA_UNAUTHENTICATED_TRAINING: "true"
      DVWA_ISOLATED_NETWORK: "true"
    volumes:
      - ./config/config.inc.php.unauth:/var/www/html/config/config.inc.php
    depends_on:
      - db
    networks:
      - training

  db:
    image: docker.io/library/mariadb:10
    environment:
      MYSQL_ROOT_PASSWORD: dvwa
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: p@ssw0rd
    volumes:
      - training-db:/var/lib/mysql
    networks:
      - training

volumes:
  training-db:

networks:
  training:
    internal: true
